# 일반 PostgreSQL의 별도 Query DB에 연결합니다. Command 5434 원본을 읽지 않습니다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/product_query}
    username: ${DB_USERNAME:product_query}
    password: ${DB_PASSWORD}
  flyway:
    # Flyway 도입 전 update로 만든 기존 개발 DB는 V1을 실행하지 않고 적용된 것으로 기록합니다. 빈 DB에서는 V1부터 실행합니다.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: update
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
