# 기존 RDS의 Query 전용 계정을 사용하며 앱에서 운영 DDL을 변경하지 않습니다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    listener:
      auto-startup: true
query:
  events:
    enabled: true
  auth:
    issuer: ${JWT_ISSUER}
    jwk-set-uri: ${ACCOUNT_JWKS_URI}
  images:
    local: false
    endpoint: ""
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
  instance:
    hostname: ${SERVICE_HOSTNAME}
    instance-id: ${spring.application.name}:${SERVICE_INSTANCE_ID}
    non-secure-port: ${SERVICE_PORT}
