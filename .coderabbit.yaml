# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Query의 공개/개인 데이터 경계와 이벤트 멱등성을 한국어로 검토합니다.
language: ko-KR
tone_instructions: "실제 버그·권한·데이터 일관성을 한국어로 설명하세요. 미확정 정책을 임의로 추가하거나 취향에 따른 변경을 반복하지 마세요."
reviews:
  profile: chill
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["^main$", "^develop$"]
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradle/wrapper/*.jar"
  path_instructions:
    - path: "src/main/java/**"
      instructions: |
        Java 21 / Boot 4의 별도 Product Query입니다. 공개 읽기와 자기 조회 모델 소비만 소유합니다.
        Command 원본 DB·Account 테이블 직접 조회·서비스 간 SQL JOIN과 공유 트랜잭션을 금지합니다.
        공개 상품과 본인 문의를 구분하고 JWT subject의 buyerId를 DB 조건에 포함하세요.
        원본 변경·재고 확보·토스 호출·Saga를 이 앱에 추가하지 마세요.
        이벤트 이력과 모델 갱신은 같은 트랜잭션이고 같은 버전/다른 내용·역전·중복·tombstone을 검토하세요.
        최초 eventId INSERT와 다른 aggregate의 동시 ID 재사용이 기존 이력을 덮어쓰지 않아야 합니다.
        임시 확보를 판매 완료로 표시하지 않고 조회 지연을 확보 보장으로 표현하지 않습니다.
        원문·주소·연락처·토큰을 공개 이벤트/로그에 넣지 않습니다. DLT 발행 실패를 성공 처리하지 마세요.
        Command Outbox·Redis·AI·AWS 배포는 미연동 단계이며 미구현 자체를 현재 PR의 결함으로 단정하지 마세요.
        한국어 주석·4칸 들여쓰기·service/impl·request/response·책임별 global/config를 유지하세요.
    - path: "src/test/**"
      instructions: |
        실제 PostgreSQL/Kafka fixture와 Command/운영 통합 검증을 구분하세요.
        소유권·공개/비공개·멱등·역전·동시 반영·DLT·재시도·시간 경계를 우선 확인하세요.
        기존 개발 DB/볼륨·실제 개인정보·AWS 자격증명을 사용하지 않습니다.
    - path: "src/main/resources/**"
      instructions: |
        개발 update·테스트 create-drop·운영 validate를 구분하고 개발마다 Flyway를 필수 요구하지 마세요.
        소비 그룹은 복제본끼리 공유하고 다른 목적의 AI/Notification과 분리합니다.
chat:
  auto_reply: true
